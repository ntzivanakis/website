# ---------------------------------------------------------------------------
# Every publication on the site lives here, once.
#
#   * The Research page (/research/) lists all of them, grouped by section,
#     in the order they appear below.
#   * The "Latest Work" grid on the home page shows the 4 newest by `date`,
#     automatically. Nothing else to edit.
#
# To add a paper: copy an existing block, change the fields, put it at the top
# of its section. That's it — the home page updates itself.
#
# Fields
#   section      Which heading it goes under (must match a name in `sections`).
#   date         Used only for ordering "Latest Work" (newest first).
#                YYYY-MM-DD. The day/month can be approximate; only the
#                relative order matters.
#   title        Full title, shown on the Research page.
#   url          Link to the paper.
#   desc         Full description, shown on the Research page.
#                HTML is allowed here (links, <strong>, <br>).
#   venue        Optional. Journal/publisher line, e.g. "Scientific Reports
#                (Nature), 2025". Leave it out for working papers.
#   short_title  Optional. Shorter title for the home page card.
#                Defaults to `title`.
#   short_desc   Optional. One-line summary for the home page card.
#                Defaults to the first 140 characters of `desc`.
# ---------------------------------------------------------------------------

sections:
  - name: "Journal Articles"
    label: "Publication"
  - name: "Working Papers"
    label: "Working Paper"
  - name: "Reports"
    label: "Report"
  - name: "PhD Thesis"
    label: "Thesis"

items:
  # --- Journal Articles ----------------------------------------------------

  - section: "Journal Articles"
    date: "2026-01-01"
    venue: "Economics of Transition and Institutional Change (Wiley), 2026"
    title: "State Capture and the Limits of Human Capital: Education and Institutional Quality in Post-Socialist Europe"
    url: "https://doi.org/10.1111/ecot.70048"
    desc: >-
      Using the European Quality of Government Index across 183 NUTS-2 regions (2010–2024), this paper shows that education raises institutional quality in Western Europe but not in post-socialist regions, where state capture nullifies its effect. An Oaxaca–Blinder decomposition attributes 77% of the West–East governance gap to different returns to education rather than different levels, and quasi-experimental evidence from democratic backsliding in Hungary and Poland confirms that intensified capture drives institutional decline.
    short_title: "State Capture and the Limits of Human Capital"
    short_desc: "Education raises institutional quality in Western Europe but not in post-socialist regions, where state capture nullifies its effect."

  - section: "Journal Articles"
    date: "2025-11-01"
    venue: "Scientific Reports (Nature), 2025"
    title: "SplitWise Regression for Capturing Nonlinear Effects in Interpretable Model Selection"
    url: "https://doi.org/10.1038/s41598-025-26597-7"
    desc: >-
      A stepwise regression framework that adaptively transforms numeric predictors into threshold-based binary features using shallow decision trees, preserving the transparency of linear models while flexibly capturing nonlinear effects. With Kurbucz, Sari Aslam & Sykulski.<br><strong>R Package:</strong> <a href="https://cran.r-project.org/web/packages/SplitWise/index.html">CRAN</a> · <a href="https://github.com/mtkurbucz/SplitWise">GitHub</a> · <a href="https://arxiv.org/abs/2505.15423">arXiv</a>
    short_title: "SplitWise Regression"
    short_desc: "A stepwise regression framework capturing nonlinear effects while maintaining interpretability."

  - section: "Journal Articles"
    date: "2025-09-01"
    venue: "Post-Communist Economies, 2025"
    title: "Unveiling the Shadows: Tracing the Informal Economy in the Balkans from 1996 to 2021"
    url: "https://doi.org/10.1080/14631377.2025.2566418"
    desc: >-
      Using the MIMIC model, we analyse the informal economy in ten Balkan countries from 1996 to 2021. Results show a decline from approximately 35% in 1996 to over 29% of GDP by 2021, with the COVID-19 pandemic causing a 1–3 percentage point increase in 2020. With Asllani & Schneider.
    short_title: "Unveiling the Shadows: Informal Economy in the Balkans"
    short_desc: "Tracing the informal economy in ten Balkan nations from 1996 to 2021 using the MIMIC model."

  # --- Working Papers ------------------------------------------------------

  - section: "Working Papers"
    date: "2025-08-01"
    title: "The Good Life Euston Index Methodology"
    url: "https://doi.org/10.2139/ssrn.6474502"
    desc: >-
      The GLEI measures multidimensional prosperity across 12 LSOAs in the Euston area of Camden, London. The third iteration of IGP's Prosperity Index framework, following the CPI in East London and the Maisha Bora Index in Dar es Salaam. With Woodcraft, Kurbucz & Sari Aslam.
    short_desc: "Measuring multidimensional prosperity across 12 LSOAs in the Euston area of Camden, London."

  - section: "Working Papers"
    date: "2025-06-01"
    title: "Measuring What Matters: A Systematic Review of Social Service Coverage in Beyond-GDP Indicators"
    url: "https://discovery.ucl.ac.uk/id/eprint/10220350/"
    desc: >-
      Meta-analysis of 66 Beyond-GDP indicators (1972–2023) mapped against a 22-domain taxonomy. Care services appear in only 17% of indicators, dropping to 6% in the full database of 209 indicators. With Melios & Moore.
    short_title: "Measuring What Matters"
    short_desc: "A meta-analysis of 66 Beyond-GDP indicators shows care services appear in only 17% of them."

  - section: "Working Papers"
    date: "2024-09-01"
    title: "East London Citizen Prosperity Index Methodology"
    url: "https://doi.org/10.2139/ssrn.4945628"
    desc: >-
      The CPI offers a novel approach to measuring prosperity beyond traditional economic indicators, applied across 15 LSOAs in five east London boroughs. With Woodcraft, Moore & Melios.
    short_desc: "Measuring prosperity beyond traditional economic indicators across 15 LSOAs in east London."

  - section: "Working Papers"
    date: "2024-10-01"
    title: "The Educational Path to Institutional Quality: A Panel Analysis of Developing Economies"
    url: "https://doi.org/10.2139/ssrn.4973048"
    desc: >-
      Examining how education influences institutional quality using a panel of 86 developing nations (1970–2014) with Fixed Effects, GMM, and bias-corrected estimators.
    short_title: "The Educational Path to Institutional Quality"
    short_desc: "How education influences institutional quality across 86 developing nations, 1970–2014."

  - section: "Working Papers"
    date: "2024-10-15"
    title: "Education and Institutional Quality: Evidence from EU Regions"
    url: "https://doi.org/10.2139/ssrn.4982819"
    desc: >-
      Determinants of institutional quality across 192 NUTS regions from 28 EU member states, using secularism as an instrument for education in IV regression.
    short_desc: "Determinants of institutional quality across 192 NUTS regions in 28 EU member states."

  - section: "Working Papers"
    date: "2023-05-01"
    title: "Crime and Unemployment in the EU: The Role of Labour Market Policies and Shadow Economy"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4453614"
    desc: >-
      The crime-unemployment relationship in 26 EU countries and its moderation by labour market policies and the shadow economy. With Goulas & Karidis.
    short_title: "Crime and Unemployment in the EU"
    short_desc: "The crime-unemployment relationship in 26 EU countries, and what moderates it."

